management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: hexlet-spring-blog
  datasource:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem

app:
  welcome-message: "Welcome to Spring blog!"
  rate-limit:
    enabled: true
    trust-x-forwarded-for: false
    login:
      enabled: true
      requests-per-minute: 20
    public-get:
      enabled: false
      requests-per-minute: 300
  # Отдельный фронт на другом origin: перечислите URL (без слэша в конце), например:
  # cors:
  #   allowed-origins:
  #     - http://localhost:5173
  #     - https://app.example.com
  cors:
    allowed-origins: []

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-}] --- %-40.40logger{39} : %m%n%wEx"

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs